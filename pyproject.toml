[project]
name = "counterpart-cv"
version = "0.1.0"
description = "Hypothesis-based object reconstruction: frozen generative inpainting + classical consistency scoring + uncertainty mapping."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "torch>=2.8",
  "torchvision",
  "diffusers>=0.32",
  "transformers>=4.46",
  "accelerate",
  "safetensors",
  "huggingface-hub",
  "opencv-python-headless",
  "scikit-image",
  "numpy",
  "scipy",
  "pandas",
  "pyarrow",
  "lpips",
  "open_clip_torch",
  "timm",
  "scikit-learn",
  "matplotlib",
  "pyyaml",
  "pydantic>=2",
  "typer",
  "rich",
  "tqdm",
]

[project.optional-dependencies]
sam = ["sam2", "einops"]
demo = ["gradio"]
patchmatch = ["PyPatchMatch", "opencv-python"]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
counterpart = "counterpart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counterpart"]

# --- torch wheels for Blackwell (compute capability 12.0) need CUDA 12.8+ ---
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

# --- tooling ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
